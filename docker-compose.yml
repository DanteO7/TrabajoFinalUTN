services:
  postgres:
    image: postgres:17-alpine

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnofacil -d turnofacil"]
      interval: 30s
      timeout: 5s
      retries: 5

    container_name: turnofacil-postgres

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      proxy-network:
        aliases:
          - turnofacil-db

  backend:
    container_name: turnofacil-backend

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    build:
      context: .
      dockerfile: backend-proyecto/backend-proyecto/Dockerfile

    env_file:
      - .env

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - proxy-network

    ports:
      - "8080:8080"

    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/api/auth/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      timeout: 5s
      retries: 3

    container_name: turnofacil-frontend

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    build:
      context: ./frontend-proyecto
      dockerfile: Dockerfile

    restart: unless-stopped

    networks:
      - proxy-network

volumes:
  postgres-data:

networks:
  proxy-network:
    external: true
